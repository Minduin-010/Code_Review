
name: Validar Nitro Sneakers

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/validar.yml"

  pull_request:
    branches:
      - main
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/validar.yml"

jobs:
  validar:
    name: Validar frontend
    runs-on: ubuntu-latest

    steps:
      # Baixa os arquivos do repositório
      - name: Baixar código
        uses: actions/checkout@v4

      # Configura o Node.js para executar as ferramentas de validação
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Verifica se o HTML existe
      - name: Verificar arquivo HTML
        run: |
          if [ ! -f frontend/index.html ]; then
            echo "Erro: frontend/index.html não encontrado."
            exit 1
          fi

      # Instala as ferramentas de validação
      - name: Instalar validadores
        run: npm install --no-save html-validate eslint

      # Valida a estrutura HTML
      - name: Validar HTML
        run: npx html-validate frontend/index.html

      # Extrai o JavaScript do HTML e verifica sua sintaxe
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      attrs = dict(attrs)
                      self.in_script = True
                      self.external = "src" in attrs
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False

          html = Path("frontend/index.html").read_text(encoding="utf-8")
          parser = ScriptExtractor()
          parser.feed(html)

          if not parser.scripts:
              raise SystemExit("Nenhum JavaScript interno encontrado.")

          for i, script in enumerate(parser.scripts, start=1):
              Path(f"/tmp/script-{i}.js").write_text(script, encoding="utf-8")
          PY

          for file in /tmp/script-*.js; do
            npx eslint --no-config-lookup \
              --no-ignore \
              --no-warn-ignored \
              --rule 'no-undef: error' \
              --rule 'no-unexpected-multiline: error' \
              --rule 'no-unreachable: error' \
              --rule 'valid-typeof: error' \
              --rule 'no-dupe-keys: error' \
              --rule 'no-constant-condition: error' \
              --rule 'no-func-assign: error' \
              --rule 'no-unmodified-loop-condition: error' \
              --rule 'no-unreachable-loop: error' \
              "$file"
          done

      # Confirma a conclusão das verificações
      - name: Validação concluída
        run: echo "Validação estática do frontend concluída com sucesso."
